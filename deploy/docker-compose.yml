# Despliegue de produccion de CASE_UML (ej. una instancia EC2 de AWS).
# Uso:  cd deploy && cp .env.example .env  (completar valores)  &&  docker compose up -d --build
# Guia completa: deploy/README.md
name: case-uml

services:
  # PostgreSQL incluido. Se activa con COMPOSE_PROFILES=local-db en .env.
  # Para usar Amazon RDS: quitar esa linea y apuntar DATABASE_URL a RDS.
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: case_uml
      POSTGRES_USER: case_uml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_uml -d case_uml"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../Backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      # El zip generado trae su propia base: en el servidor no se crean
      # bases "gen_..." sobre la base de la plataforma.
      GENERATOR_CREATE_DATABASES: "false"

  web:
    build: ../Frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
