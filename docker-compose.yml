services:
  postgres:
    image: postgres:16-alpine
    container_name: case_uml_postgres
    environment:
      POSTGRES_DB: case_uml
      POSTGRES_USER: case_uml
      POSTGRES_PASSWORD: case_uml
    ports:
      # 5433 en el host: en esta maquina el 5432 nativo de Windows ya
      # esta ocupado por otro PostgreSQL instalado localmente.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
